apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
        - name: lms-portal
          image: pratheebapari/lms-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090